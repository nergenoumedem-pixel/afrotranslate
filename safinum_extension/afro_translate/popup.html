<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Traduction</title>
<style>
  :root{--vert:#0f6e56;--vert-fonce:#0b5743;--fond:#ffffff;--texte:#1d2320;--doux:#5b6661;--carte:#f3f7f5;--bord:#d5e2dc}
  @media (prefers-color-scheme:dark){:root{--fond:#16201c;--texte:#eef4f1;--doux:#a9b8b1;--carte:#1f2c27;--bord:#2f403a}}
  *{box-sizing:border-box}
  body{margin:0;width:320px;font:14px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--fond);color:var(--texte)}
  header{display:flex;align-items:center;gap:12px;padding:16px 18px;background:linear-gradient(135deg,#0f6e56,#14866a);color:#fff}
  .logo{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:18px}
  header h1{font-size:16px;margin:0;font-weight:700}
  header p{margin:0;font-size:12px;opacity:.85}
  main{padding:16px 18px 6px}
  label.titre{display:block;font-size:12px;font-weight:600;color:var(--doux);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .choix{display:grid;gap:8px}
  .option{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--bord);border-radius:10px;background:var(--carte);cursor:pointer}
  .option input{accent-color:var(--vert);width:16px;height:16px;margin:0}
  .option:has(input:checked){border-color:var(--vert);box-shadow:0 0 0 1px var(--vert) inset}
  .option b{font-weight:600}.option small{display:block;color:var(--doux);font-size:12px}
  button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--vert);color:#fff;font:600 15px "Segoe UI",system-ui,sans-serif;cursor:pointer}
  button:hover{background:var(--vert-fonce)} button:disabled{opacity:.6;cursor:progress}
  :focus-visible{outline:3px solid #f4b400;outline-offset:2px}
  .bascule{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:10px 0;border-top:1px solid var(--bord)}
  .switch{position:relative;width:42px;height:24px;flex:none}
  .switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
  .switch span{position:absolute;inset:0;border-radius:24px;background:#9aa8a2;transition:.2s}
  .switch span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked+span{background:var(--vert)} .switch input:checked+span::after{transform:translateX(18px)}
  .switch input:focus-visible+span{outline:3px solid #f4b400;outline-offset:2px}
  details{margin-top:4px;font-size:13px;color:var(--doux)}summary{cursor:pointer;padding:4px 0}
  #message{min-height:18px;margin:8px 0 0;font-size:12px;color:var(--doux)} #message.erreur{color:#c62828}
  footer{padding:8px 18px 14px;font-size:11px;color:var(--doux)}
</style></head>
<body>
  <header><div class="logo" aria-hidden="true">N</div>
    <div><h1>Safinum · Traduction</h1><p>Langues nationales du Cameroun</p></div></header>
  <main>
    <label class="titre" id="t-langue">Langue</label>
    <div class="choix" id="choix" role="radiogroup" aria-labelledby="t-langue"></div>
    <button id="go">Traduire la page</button>
    <p id="message" role="status" aria-live="polite"></p>
    <p id="diag" style="font-size:11px;color:#667;margin:4px 0 0"></p>
    <div class="bascule"><label for="toujours">Toujours traduire dans cette langue</label>
      <span class="switch"><input type="checkbox" id="toujours"><span></span></span></div>
    <details><summary>Options avancées</summary>
      <div class="bascule"><label for="memoire">Utiliser les phrases validées par le locuteur (plus rapide)</label>
        <span class="switch"><input type="checkbox" id="memoire" checked><span></span></span></div>
    </details>
  </main>
  <footer>Traduction sur l'ordinateur : aucune donnée n'est envoyée. Montants, noms et références restent inchangés.</footer>
  <script src="langues.js"></script>
  <script src="popup.js"></script>
</body></html>
